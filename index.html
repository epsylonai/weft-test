.chain-light-visitor-fox{bottom:20%;width:14%}.chain-light-visitor-deer{bottom:29%;width:12%}
.chain-light .chain-light-visitor-butterflies{top:18%;bottom:auto;width:13%;animation-name:chain-light-wing!important}
.chain-light .chain-light-visitor-spirit{bottom:34%;width:14%;animation-name:chain-light-wing!important}
.chain-light-visitor-glass,.chain-light-visitor-aurora,.chain-light-visitor-rays,.chain-light-visitor-gold,.chain-light-visitor-sigils,.chain-light-visitor-bloom{top:2%;bottom:auto;height:32%;width:15%;background:linear-gradient(135deg,transparent 10%,#f7be8540 35%,#a6bfff28 50%,#dfb2f73d 65%,transparent 90%);mask-image:linear-gradient(transparent,#0008,transparent)}
.chain-light-visitor-aurora{height:45%;background:linear-gradient(100deg,transparent,#a2ddce44,#a9a4e522,transparent)}
.chain-light-visitor-rays{background:repeating-linear-gradient(125deg,transparent 0 15px,#ffe6ac33 16px 20px,transparent 21px 36px)}
.chain-light-visitor-gold{background:radial-gradient(ellipse,#ffd99655,transparent 65%)}
.chain-light-visitor-sigils{height:24%;border:1px solid #c5a6f544;border-radius:50%;background:repeating-radial-gradient(ellipse,transparent 0 12px,#bd9cf733 13px 14px,transparent 15px 27px)}

@keyframes chain-light-visitor{0%,100%{opacity:0;transform:translate(-3px,3px)}22%,72%{opacity:.82;transform:translate(2px,0)}}
@keyframes chain-light-wing{0%,100%{opacity:0;transform:translate(-4px,5px) rotate(-2deg)}25%,70%{opacity:.76;transform:translate(5px,-5px) rotate(2deg)}}
.chain-light[data-motion=static] .chain-light-effects{display:none!important}

.chain-light .chain-light-visitor-manta,.chain-light .chain-light-visitor-whale,.chain-light .chain-light-visitor-glowfish{animation-name:chain-light-drift!important}
.chain-light .chain-light-visitor-shootingstar,.chain-light .chain-light-visitor-meteors{animation-name:chain-light-star-fall!important}
@keyframes chain-light-drift{0%,100%{opacity:0;transform:translate(-6px,8px) rotate(-1deg)}24%,72%{opacity:.72;transform:translate(6px,-6px) rotate(1deg)}}
@keyframes chain-light-star-fall{0%{opacity:0;transform:translate(16px,-12px)}20%{opacity:.78;transform:translate(6px,-3px)}74%{opacity:.6;transform:translate(-12px,12px)}100%{opacity:0;transform:translate(-20px,20px)}}

.chain-base-line{display:flex;align-items:baseline;gap:5px;font:8px/14px Verdana,sans-serif;color:#baa98a}.chain-base-line .chain-base{font:13px/14px Georgia,serif;display:inline}.chain-counts{font:7px/10px Verdana,sans-serif;color:#b6ac98}

.end-chain{font:12px Georgia,serif;gap:9px}.end-chain strong{font-size:18px;font-weight:400}.end-full-light{margin:4px 0;color:#f2d28e;font:13px Georgia,serif}.end-full-light[hidden]{display:none}
.run-per-level li{line-height:1.5}.settings-card{max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto}.settings-records{display:block;width:100%;min-height:44px;margin-top:18px;border:1px solid #ac8e595c;border-radius:8px;background:#29332ded;color:#ead5a6;font:13px Georgia,serif;letter-spacing:1px}

.records-panel{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:16px max(12px,env(safe-area-inset-right));background:rgba(8,18,25,.98);color:#f6e8ca;overflow:auto;overscroll-behavior:contain;pointer-events:auto}.records-panel[hidden]{display:none!important}.records-card{width:min(100%,360px);max-height:calc(100svh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;border:1px solid #c7a76c66;border-radius:18px;padding:18px 18px 12px;background:#16282e;box-sizing:border-box}.records-card h2{margin:0 0 14px;text-align:center;font:26px/1.2 Georgia,serif;font-weight:400}.records-list{margin:0}.records-entry{padding:12px 0;border-top:1px solid #d7bd8226}.records-entry dt{font:13px/1.2 Verdana,sans-serif;color:#d8c69f}.records-entry dd{margin:5px 0;font:28px/1.15 Georgia,serif;color:#fff1ce;font-variant-numeric:tabular-nums}.records-meta{margin:4px 0;color:#b8c6c4;font:11px/1.5 Verdana,sans-serif}.records-close{display:block;position:sticky;bottom:0;width:100%;min-height:44px;margin-top:12px;border:1px solid #d2b47888;border-radius:9px;background:#2b3c3c;color:#f6e6bf;font:12px/1 Verdana,sans-serif;letter-spacing:1px;touch-action:manipulation}.records-close:focus-visible{outline:2px solid #ffe4a1;outline-offset:2px}

.weft-rank-dialog{position:fixed;inset:0;z-index:90;box-sizing:border-box;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:center;background:#101a20fa;color:#f7edcd;font:15px Georgia,serif;overflow:auto;overscroll-behavior:contain}
.weft-rank-dialog[hidden]{display:none!important}.weft-rank-body{position:relative;box-sizing:border-box;width:min(100%,470px);max-height:100%;overflow:auto;background:#15252b;border:1px solid #c5aa6f66;border-radius:13px;padding:18px 12px;box-shadow:0 10px 35px #0006}.weft-rank-body h2{margin:0 88px 12px 0;font:19px Georgia,serif}.weft-rank-dialog button{min-height:44px;min-width:44px;background:#25383b;color:#f7edcd;border:1px solid #c5aa6f77;border-radius:7px;font:12px Georgia,serif;padding:8px;touch-action:manipulation}.weft-rank-dialog button:focus-visible,.weft-rank-dialog input:focus-visible{outline:2px solid #f2d68b;outline-offset:2px}.weft-rank-close{position:absolute;right:12px;top:10px}.leaderboard-scope{font:11px Verdana,sans-serif;color:#c5b88f;letter-spacing:.1em}.leaderboard-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.leaderboard-tabs [aria-selected=true]{border-color:#f2d68b;background:#42504a}.leaderboard-list,.leaderboard-you ol{padding:0;list-style:none;margin:0}.leaderboard-list li,.leaderboard-you li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:5px 8px;padding:12px 4px;border-top:1px solid #a68c5544}.leaderboard-list strong,.leaderboard-you strong{overflow-wrap:anywhere;font-weight:normal}.leaderboard-value{font:17px Verdana,sans-serif;font-variant-numeric:tabular-nums}.leaderboard-list small,.leaderboard-you small{grid-column:2/4;color:#d5c9a7;font-size:12px}.leaderboard-place{color:#bfb18d}.leaderboard-you{margin-top:18px;padding:8px;background:#c5aa6f12;border:1px solid #c5aa6f55;border-radius:7px}.leaderboard-you h3{font:11px Verdana,sans-serif;letter-spacing:.12em;margin:0 0 4px}.leaderboard-status{color:#d5c9a7;font-size:13px}.nickname-form{display:grid;gap:12px}.nickname-form h2{margin-right:0}.nickname-form p{margin:0;line-height:1.45}.nickname-form label{font-size:12px;color:#d5c9a7}.nickname-form input{box-sizing:border-box;width:100%;min-height:48px;border:1px solid #c5aa6f99;border-radius:7px;background:#0d1b21;color:#fff3cc;font:20px Georgia,serif;padding:10px}.nickname-error{min-height:20px;color:#ffd0b4}.nickname-form button{width:100%}

/* Six-world navigation adds no board-ancestor animation. */
.opening-records{left:25%;transform:translateX(-50%);width:38%;bottom:7%;min-height:44px}.opening-leaderboard{position:absolute;left:75%;transform:translateX(-50%);bottom:7%;width:42%;min-height:44px;background:transparent;border:0;color:#d9bf87;font:13px Georgia,serif;letter-spacing:.3px;touch-action:manipulation}.opening-screen .opening-daily{bottom:13.5%}.opening-screen.has-resume .opening-start{bottom:29%}.opening-screen.has-resume .opening-new-game{bottom:22%}.opening-screen.has-resume .opening-daily{bottom:15.5%}
.settings-name{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.settings-name button,.end-leaderboard{min-height:44px;color:#eee0bd;background:#12232cee;border:1px solid #b4a27b77;border-radius:7px;font:13px Georgia,serif;padding:8px 14px}.end-leaderboard{display:block;margin:6px auto;min-width:160px}.settings-player-name{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:14px Georgia,serif;color:#f1dfba}
@media(max-height:720px){.opening-records,.opening-leaderboard{bottom:5.5%;font-size:12px}.opening-screen .opening-start{bottom:25%}.opening-screen .opening-daily{bottom:14%}.opening-screen.has-resume .opening-start{bottom:33%}.opening-screen.has-resume .opening-new-game{bottom:23%}.opening-screen.has-resume .opening-daily{bottom:14.5%}.settings-card{max-height:calc(100dvh - 28px);overflow:auto}}

.opening-records{right:auto}.opening-screen .opening-daily{left:50%;transform:translateX(-50%);width:140px;min-width:140px}

<body>
  <main id="game" class="game" data-world="tapestry" aria-label="Weft tapestry board">
    <header id="header" class="status">
      <button id="score" class="score" aria-label="Coin pouch; activate three times for local metrics">
        <svg class="pouch-icon" viewBox="0 0 64 70" aria-hidden="true"><defs><linearGradient id="leather" x1="0" x2="1" y2="1"><stop stop-color="#ad7946"/><stop offset=".52" stop-color="#63412e"/><stop offset="1" stop-color="#352b26"/></linearGradient></defs><path d="M21 6Q32 13 43 6L40 20C44 27 58 36 57 51Q56 66 32 66Q8 66 7 51C6 36 20 27 24 20Z" fill="url(#leather)" stroke="#d5ad6d" stroke-width="1.5"/><path d="M23 21Q32 25 42 21M21 25Q32 29 44 25M32 26C26 40 23 48 25 60M36 27C43 43 44 48 41 61" fill="none" stroke="#b88e59" stroke-width="1.2"/><path d="M23 21L15 29M41 21L49 30" stroke="#e8c789" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="44" r="8" fill="#d4ae59" stroke="#f6d58d"/><circle cx="32" cy="44" r="5.3" fill="none" stroke="#76532d" stroke-width="1.1"/></svg>
        <span class="score-copy"><span id="scoreValue">0</span><span class="personal-best">Best <span id="personalBest">0</span></span></span><span id="goalStars" class="pouch-goals" aria-label="Board stars"></span>
      </button>
      <div class="seed-badge" aria-label="Deal seed">
        <svg viewBox="0 0 36 24" aria-hidden="true"><path d="M2 2v20M7 2v20M12 2v20M18 2v20M23 2v20M29 2v20M34 2v20"/></svg>
        <span id="dailyLabel" class="daily-label" hidden></span><span id="seedValue">123</span>
        <span id="winnableBadge" class="winnable-badge" role="img" aria-label="Winnable: clearing line verified" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M6 12l4 4 8-9"/></svg></span>
      </div>
      <div class="status-line" aria-hidden="true"></div>
    </header>
    <section id="weave" class="weave" aria-label="Three equal pyramids in a triangle">
      <div id="cardsLayer" class="cards-layer"></div>
    </section>
    <section class="controls" aria-label="Hand and actions">
      <div id="handBanner" class="hand-banner learned-hidden" role="status" aria-live="polite">best: HIGH CARD ×1</div>
      <div id="igniteSeam" class="ignite-seam learned-hidden" aria-hidden="true"></div>
      <div class="hand-tray">
        <div id="threadCard" class="thread-card" aria-label="Thread"></div>
        <div id="handFan" class="hand-fan learned-hidden" aria-label="Hand"></div>
        <button id="spool" class="spool" aria-label="Draw from Spool">
          <span id="spoolCard" class="spool-card"></span>
          <span id="spoolCount" class="spool-count">21</span>
        </button>
      </div>
      <div id="chainMeter" class="chain-meter" aria-label="Chain 0"><div class="chain-title">CHAIN <strong id="chainLength">0</strong></div><div id="chainNotches" class="chain-notches" aria-hidden="true"><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i></div><small id="chainLightLabel">0 / 10</small><div class="chain-base-line">BASE <strong id="chainBase" class="chain-base">0</strong></div><div class="chain-counts"><span id="linkCount" class="suited-count">0</span> suited</div></div>
      <div class="decision-row"><span class="formula-hint">BASE × BEST HAND</span><div id="scoreEquation" class="score-equation" role="status" aria-live="polite" hidden></div></div>
      <footer class="deal-actions">
        <button id="newDeal" class="secondary">NEW DEAL</button>
        <button id="replay" class="secondary">REPLAY</button>
        <button id="sound" class="sound" aria-label="Mute effects" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 15h7L22 6v28l-10-9H5Z"/><path class="sound-waves" d="M27 12q11 8 0 16M31 6q19 14 0 28"/></svg></button>
        <button id="musicToggle" class="sound music-toggle" aria-label="Music controls" aria-expanded="false" aria-controls="musicPanel"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M16 28V10l17-4v18M16 14l17-4"/><ellipse cx="10" cy="29" rx="6" ry="4"/><ellipse cx="27" cy="25" rx="6" ry="4"/></svg></button>
      </footer>
      <section id="musicPanel" class="music-panel" role="group" aria-label="Music controls" hidden>
        <div class="music-heading"><label for="quickMusicVolume">MUSIC</label><button id="quickMusicMute" class="music-mute" aria-label="Mute music" aria-pressed="false">MUTE</button></div>
        <div class="music-track-controls"><button id="quickMusicPrevious" aria-label="Previous music track">‹</button><span id="quickMusicTrackName" class="music-track-name" aria-live="polite">Candlelit Hall</span><button id="quickMusicNext" aria-label="Next music track">›</button></div>
        <div class="music-level"><input id="quickMusicVolume" type="range" min="0" max="100" step="1" value="25" aria-label="Music volume" aria-valuetext="25 percent"><output id="quickMusicValue" for="quickMusicVolume">25%</output></div>
      </section>
    </section>
    <svg id="chainRibbon" class="chain-ribbon" aria-hidden="true"><defs><filter id="ribbonGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs><g id="ribbonGlowLayer" filter="url(#ribbonGlow)"></g><g id="ribbonLines"></g><g id="ribbonNodes"></g></svg>
  </main>
<div id="musicTrackToast" class="music-track-toast" role="status" aria-live="polite" hidden></div>
  <section id="endPanel" class="overlay" role="dialog" aria-modal="true" aria-label="Board result" hidden>
    <div class="end-card">
      <button id="endSettings" class="end-settings" aria-label="Settings">⚙</button>
      <svg id="endIcon" class="end-icon" viewBox="0 0 80 80" aria-hidden="true"></svg>
      <div id="endStars" class="end-stars" aria-label="Board stars"></div>
      <div id="endScore" class="end-score" aria-label="Coins earned">0</div>
      <div class="end-chain"><svg viewBox="0 0 32 40" aria-hidden="true"><rect x="8" y="1" width="16" height="24" rx="8"/><rect x="8" y="15" width="16" height="24" rx="8"/></svg><span>Longest chain <strong id="endLongest">0</strong></span><span id="endCleared">0/30</span></div>
      <p id="endFullLight" class="end-full-light" hidden></p>
      <div id="endBestHand" class="end-best">HIGH CARD ×1</div>
      <div id="endClearBonus" class="end-clear-bonus"></div><div id="endPersonalBest" class="end-personal-best"></div><div id="endNewBest" class="end-new-best" hidden>New best</div>
      <button id="endNewDeal" class="bank">NEW DEAL</button>
      <button id="endReplay" class="secondary">REPLAY</button>
      <button id="version" class="version" aria-label="Version 6.9; tap three times for diagnostics">v6.9</button>
    </div>
  </section>
  <section id="debugPanel" class="overlay" role="dialog" aria-modal="true" aria-label="Local metrics" hidden>
    <div class="debug-card">
      <h2>Local metrics</h2>
      <dl id="metricFields"></dl>
      <textarea id="metricsJson" readonly aria-label="Metrics JSON"></textarea>
      <div class="debug-actions"><button id="copyMetrics" class="secondary">COPY JSON</button><button id="closeDebug" class="secondary">CLOSE</button></div>
      <p id="copyStatus" role="status"></p>
    </div>
  </section>
  <section id="settingsPanel" class="overlay" role="dialog" aria-modal="true" aria-label="Settings" hidden>
    <div class="settings-card">
      <button id="closeSettings" class="settings-close" aria-label="Close settings">×</button>
      <h2>SETTINGS</h2>
      <div class="setting-label">ANIMATIONS</div>
      <div class="animation-options" role="group" aria-label="Animations">
        <button data-animation-mode="off" aria-pressed="false">OFF</button>
        <button data-animation-mode="subtle" aria-pressed="false">SUBTLE</button>
        <button data-animation-mode="full" aria-pressed="true">FULL</button>
      </div>
      <div class="effects-setting"><label for="effectsToggle">SOUND EFFECTS</label><button id="effectsToggle" aria-pressed="true">ON</button></div>
      <div class="music-heading"><label for="musicVolume">MUSIC</label><button id="musicMute" class="music-mute" aria-label="Mute music" aria-pressed="false">MUTE</button></div>
      <div class="music-track-controls"><button id="musicPrevious" aria-label="Previous music track">‹</button><span id="musicTrackName" class="music-track-name" aria-live="polite">Candlelit Hall</span><button id="musicNext" aria-label="Next music track">›</button></div>
      <div class="music-level"><input id="musicVolume" type="range" min="0" max="100" step="1" value="25" aria-label="Music volume" aria-valuetext="25 percent"><output id="musicValue" for="musicVolume">25%</output></div>
      <button id="settingsRecords" class="settings-records">RECORDS</button>
    </div>
