.effects-setting button[aria-pressed=false]{color:#9da7a5;background:#18252e}.settings-card input[type=range]{width:100%;height:44px;margin:4px 0 0;accent-color:#e4c17a;touch-action:pan-y}

@media(max-height:720px){.opening-heading{top:24.5%}.opening-title-art{width:min(88%,340px)}.opening-subtitle{font:var(--type-text);letter-spacing:1.8px}.opening-headphones{margin-top:20px;font:var(--type-label)}.opening-start{height:58px;bottom:15%;font:var(--type-value)}}

/* The header/shelf retain their44/150px allocations; the board rectangle is unchanged. */
.score-copy{display:flex;flex-direction:column;align-items:flex-start;gap:1px}.score-copy #scoreValue{font:var(--type-score);line-height:27px}.personal-best{font:var(--type-label);color:#c9ba97;white-space:nowrap;line-height:11px}.pouch-goals{display:flex;align-items:center;gap:3px;margin-left:2px}.goal-seal{display:inline-grid;place-items:center;width:17px;height:20px;color:#847557;font:var(--type-text);opacity:.65;transition:color .25s,opacity .25s}.goal-seal.filled{color:#f1cf7e;opacity:1}.seed-badge{max-width:48%;flex-wrap:wrap;justify-content:flex-end;gap:4px}.daily-label{flex-basis:100%;font:var(--type-label);color:#f0d28f;line-height:12px}.daily-label[hidden]{display:none}.seed-badge #seedValue{font:var(--type-label)}.chain-meter{position:absolute;left:4px;top:84px;width:calc(var(--hand-w,54px) + 12px);height:60px;text-align:center;z-index:6;color:#f4d79b;pointer-events:none}.chain-meter>small{display:block;font:var(--type-label);letter-spacing:1px;color:#bda983}.chain-base{display:block;font:var(--type-value);font-variant-numeric:tabular-nums}.chain-counts{font:var(--type-label);color:#d3c2a2}.chain-counts .suited-count{color:#efc978}.decision-row{display:flex;align-items:center;justify-content:center}.formula-hint{font:var(--type-label);letter-spacing:.6px;color:#c7b591;opacity:.75}.score-equation{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3px;border-block:1px solid #c49a594d;background:linear-gradient(90deg,transparent,#2a2b22e8 12%,#2a2b22e8 88%,transparent);color:#f2d99f;font:var(--type-label);white-space:nowrap;pointer-events:none;z-index:8}.score-equation[hidden]{display:none}.equation-base{font:var(--type-text)}.equation-seal{font:var(--type-label);padding:5px 3px;border:1px solid #a8854a;border-radius:8px;background:#58442b5c;white-space:normal;max-width:83px;line-height:12px}.equation-multiplier{font:var(--type-caption)}.equation-op{color:#bda983}.score-equation strong{font:var(--type-text);font-weight:400}.show-equation .formula-hint{visibility:hidden}.suited-spark{position:absolute;z-index:22;pointer-events:none;color:#ffe4a1;font:var(--type-value);text-shadow:0 0 7px #d6a337;} .hand-banner{font:var(--type-caption)}.hand-banner.upgraded{color:#fff2c7;text-shadow:0 0 9px #d8b15a}.end-stars{display:flex;justify-content:center;gap:8px;margin:2px 0 8px}.end-stars .goal-seal{width:30px;height:30px;font:var(--type-score)}.end-clear-bonus,.end-personal-best{margin:8px 0;color:#d6c5a0;font:var(--type-caption)}.end-new-best{font:var(--type-text);color:#f1d28c;margin:8px 0}.end-new-best[hidden]{display:none}.end-card{max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto}.end-score{font-variant-numeric:tabular-nums}
.opening-daily{position:absolute;left:50%;bottom:max(12%,calc(7px + env(safe-area-inset-bottom)));transform:translateX(-50%);min-height:44px;min-width:140px;padding:7px 18px;border:1px solid #9c84534d;border-radius:9px;background:#202a2b80;color:#e7c98e;font:var(--type-text);touch-action:manipulation}.opening-daily small{display:block;font:var(--type-label);color:#bdb59e;margin-top:3px}.opening-new-game{bottom:12%}.opening-screen.has-resume .opening-start{bottom:25%}.opening-screen.has-resume .opening-new-game{bottom:17%}.opening-screen.has-resume .opening-daily{bottom:10.5%}
@media(max-height:720px){.opening-heading{top:19%}.opening-start{bottom:21%}.opening-daily{bottom:8%}.opening-screen.has-resume .opening-start{bottom:26%}.opening-screen.has-resume .opening-new-game{bottom:17%}.opening-screen.has-resume .opening-daily{bottom:8%}.end-card{padding:24px 22px}.end-score{font:var(--type-large)}.end-stars{margin-bottom:3px}.end-clear-bonus,.end-personal-best{margin:5px 0}.seed-badge #seedValue{font:var(--type-label)}}

.real-run .show-equation .run-board-status{visibility:hidden}

/* Owner amendment: one uniform covered treatment, present before scene startup.
   The same lightweight whole-card shade used by v6.6.1 LOW also covers indices. */
.card.covered,.scene-ready .card.covered{filter:none!important;transition:opacity 220ms,scale 220ms}
.card.covered [data-card-body],.scene-ready .card.covered [data-card-body]{filter:none!important}
.card.covered::after,.scene-ready .card.covered::after,.scene-ready[data-scene-tier="LOW"] .card.covered::after{content:'';display:block!important;position:absolute;inset:0;border:0;border-radius:inherit;background:rgba(7,12,17,.738);pointer-events:none}

.chain-light[hidden],.chain-light [hidden]{display:none!important}
