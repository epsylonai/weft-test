<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weft">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,"><link rel="stylesheet" href="./game-352b1281939e4459.css"><link rel="stylesheet" href="./tutorial-4896c3e09ff9b405.css"><script>(()=>{const make=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.get(String(k))??null,setItem:(k,v)=>m.set(String(k),String(v)),removeItem:k=>m.delete(String(k)),clear:()=>m.clear()}};for(const name of ['localStorage','sessionStorage'])Object.defineProperty(window,name,{value:make(),configurable:false});Object.defineProperty(window,'indexedDB',{value:undefined,configurable:false});window.__WEFT_TEST_ACTIVE__=true;try{const s=parent.getComputedStyle(parent.document.documentElement);for(const side of ['top','right','bottom','left'])document.documentElement.style.setProperty('--native-safe-area-inset-'+side,s.getPropertyValue('--native-safe-area-inset-'+side)||'0px')}catch{}})();</script>
  <link rel="preload" href="fonts/cinzel-roman-latin.woff2" as="font" type="font/woff2" crossorigin>

  <meta name="theme-color" content="#0b1923">
  <title>Weft — How to Play</title>
  <style>/* First paint is independent of game CSS, fonts, image decode and game parsing. */
html,body{margin:0;min-height:100%;background:#000}body[data-weft-boot="loading"]>:not(#weftBoot):not(#weftStudio):not(script){visibility:hidden!important}#weftBoot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;box-sizing:border-box;min-height:100dvh;padding:24px;background:#000;color:#e8cb8a;opacity:1;transition:opacity 1.2s ease-in-out;isolation:isolate}#weftBoot[data-finished="true"]{opacity:0;pointer-events:none}#weftBoot .boot-inner{opacity:0;transition:opacity .8s ease-in-out;width:min(78vw,340px);text-align:center}#weftBoot svg{display:block;width:100%;height:auto;overflow:visible}#weftBoot .loader-word-thread path,#weftBoot .loader-word-ornament path{stroke-dasharray:1;stroke-dashoffset:1;animation:boot-weave 1.25s ease forwards}#weftBoot .loader-word-thread path:nth-child(2){animation-delay:.12s}#weftBoot .loader-word-thread path:nth-child(3){animation-delay:.22s}#weftBoot .loader-word-thread path:nth-child(4){animation-delay:.3s}#weftBoot .loader-word-fill{opacity:0;animation:boot-fill .6s .8s ease forwards}#weftBoot .boot-thread{height:2px;margin:18px 16px 0;background:#65533366;overflow:hidden}#weftBoot .boot-progress{display:block;width:100%;height:100%;background:linear-gradient(90deg,#9d7744,#e8cb8a,#fff2c9);transform:scaleX(0);transform-origin:left center;transition:transform .12s linear}#weftBoot .boot-label{margin:15px 0 0;font:12px/1.5 Georgia,serif;letter-spacing:.1em;color:#ccb584}#weftBoot .boot-retry{margin:18px auto 0;min-width:112px;min-height:44px;border:1px solid #b79757;border-radius:6px;background:#152734;color:#f2d99e;font:14px Georgia,serif}#weftBoot [hidden]{display:none!important}#weftBoot[data-calm="true"] .loader-word-fill{opacity:1;animation:none}#weftBoot[data-calm="true"] .loader-word-thread path,#weftBoot[data-calm="true"] .loader-word-ornament path{stroke-dashoffset:0;animation:none}@keyframes boot-weave{to{stroke-dashoffset:0}}@keyframes boot-fill{to{opacity:1}}@media(prefers-reduced-motion:reduce){#weftBoot .loader-word-fill{opacity:1;animation:none}#weftBoot .loader-word-thread path,#weftBoot .loader-word-ornament path{stroke-dashoffset:0;animation:none}#weftBoot .boot-progress{transition:none}}

/* Approved round3 art is isolated as an SVG image, without colour/path changes. */
#weftStudio{position:fixed;inset:0;z-index:2147483100;display:grid;place-items:center;box-sizing:border-box;background:#000;isolation:isolate;opacity:1;transition:opacity 1.2s ease-in-out;touch-action:manipulation;user-select:none}#weftStudio picture,#weftStudio img{display:block;width:100%;height:100%;margin:0}#weftStudio img{object-fit:contain;object-position:center}#weftStudioSkip{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;appearance:none;border:0;border-radius:0;background:transparent;box-shadow:none;transform:none;touch-action:manipulation;cursor:pointer}#weftStudioSkip:focus-visible{outline:2px solid #D8B873;outline-offset:-8px}#weftStudio[data-finished="true"]{opacity:0;pointer-events:none}#weftBoot:not([data-studio-ended="true"]) .loader-word-thread path,#weftBoot:not([data-studio-ended="true"]) .loader-word-ornament path,#weftBoot:not([data-studio-ended="true"]) .loader-word-fill{animation-play-state:paused}@media(prefers-reduced-motion:reduce){#weftStudio,#weftBoot{transition:opacity .6s ease-in-out}#weftStudio picture,#weftBoot .boot-inner{transition:opacity .6s ease-in-out}}

/* One black surround carries studio, delayed loader and opening. */
#weftStudio picture{opacity:1;transition:opacity .8s ease-in-out}#weftStudio[data-phase="blackening"] picture{opacity:0}#weftBoot[data-visible="true"] .boot-inner{opacity:1}#weftBoot[data-phase="blackening"] .boot-inner{opacity:0}#weftBoot[data-failed="true"] .boot-inner{opacity:1}
</style>
</head>
<body>
  
  <main id="game" class="game" data-world="tapestry" aria-label="Weft tapestry board">
    <header id="header" class="status">
      <button id="score" class="score" aria-label="Coin pouch; activate three times for diagnostics and local metrics">
        <svg class="pouch-icon" viewBox="0 0 64 70" aria-hidden="true"><defs><linearGradient id="leather" x1="0" x2="1" y2="1"><stop stop-color="#ad7946"/><stop offset=".52" stop-color="#63412e"/><stop offset="1" stop-color="#352b26"/></linearGradient></defs><path d="M21 6Q32 13 43 6L40 20C44 27 58 36 57 51Q56 66 32 66Q8 66 7 51C6 36 20 27 24 20Z" fill="url(#leather)" stroke="#d5ad6d" stroke-width="1.5"/><path d="M23 21Q32 25 42 21M21 25Q32 29 44 25M32 26C26 40 23 48 25 60M36 27C43 43 44 48 41 61" fill="none" stroke="#b88e59" stroke-width="1.2"/><path d="M23 21L15 29M41 21L49 30" stroke="#e8c789" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="44" r="8" fill="#d4ae59" stroke="#f6d58d"/><circle cx="32" cy="44" r="5.3" fill="none" stroke="#76532d" stroke-width="1.1"/></svg>
        <span class="score-copy"><span id="scoreValue">0</span><span class="personal-best">Best <span id="personalBest">0</span></span></span><span id="goalStars" class="pouch-goals" aria-label="Board stars"></span>
      </button>
      <div class="seed-badge" aria-label="Deal seed">
        <svg viewBox="0 0 36 24" aria-hidden="true"><path d="M2 2v20M7 2v20M12 2v20M18 2v20M23 2v20M29 2v20M34 2v20"/></svg>
        <span id="dailyLabel" class="daily-label" hidden></span><span id="seedValue">123</span>
        <span id="winnableBadge" class="winnable-badge" role="img" aria-label="Winnable: clearing line verified" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M6 12l4 4 8-9"/></svg></span>
      </div>
      <div class="status-line" aria-hidden="true"></div>
    </header>
    <section id="weave" class="weave" aria-label="Three equal pyramids in a triangle">
      <div id="cardsLayer" class="cards-layer"></div>
    </section>
    <section class="controls" aria-label="Hand and actions">
      <div id="handBanner" class="hand-banner learned-hidden" role="status" aria-live="polite">Best: High Card ×1</div>
      <div id="igniteSeam" class="ignite-seam learned-hidden" aria-hidden="true"></div>
      <div class="hand-tray">
        <div id="threadCard" class="thread-card" aria-label="Thread"></div>
        <div id="handFan" class="hand-fan learned-hidden" aria-label="Hand"></div>
        <button id="spool" class="spool" aria-label="Draw from Spool">
          <span id="spoolCard" class="spool-card"></span>
          <span id="spoolCount" class="spool-count">21</span>
        </button>
      </div>
      <div id="chainMeter" class="chain-meter" aria-label="Chain 0"><div class="chain-title">CHAIN <strong id="chainLength">0</strong></div><div id="chainNotches" class="chain-notches" aria-hidden="true"><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i><i data-lit="false"></i></div><small id="chainLightLabel">0 / 10</small><div class="chain-base-line">BASE <strong id="chainBase" class="chain-base">0</strong></div><div class="chain-counts"><span id="linkCount" class="suited-count">0</span> suited</div></div>
      <div class="decision-row"><span class="formula-hint">BASE × HAND</span><div id="scoreEquation" class="score-equation" role="status" aria-live="polite" hidden></div></div>
      <footer class="deal-actions">
        <button id="newDeal" class="secondary">NEW DEAL</button>
        <button id="replay" class="secondary">REPLAY</button>
        <button id="sound" class="sound" aria-label="Mute effects" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 15h7L22 6v28l-10-9H5Z"/><path class="sound-waves" d="M27 12q11 8 0 16M31 6q19 14 0 28"/></svg></button>
        <button id="musicToggle" class="sound music-toggle" aria-label="Music controls" aria-expanded="false" aria-controls="musicPanel"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M16 28V10l17-4v18M16 14l17-4"/><ellipse cx="10" cy="29" rx="6" ry="4"/><ellipse cx="27" cy="25" rx="6" ry="4"/></svg></button>
        <button id="playSettings" class="sound settings-toggle" aria-label="Settings" aria-haspopup="dialog" aria-controls="settingsPanel"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m16 5 8 0 1.5 5 4 2 5-.5 4 7-3.5 4 .5 4-4 7-5-1.5-3.5 2-1.5 5h-8l-1.5-5-3.5-2-5 1.5-4-7 .5-4-3.5-4 4-7 5 .5 4-2Z" transform="translate(3 1) scale(.85)"/><circle cx="20" cy="20" r="6"/></svg></button>
      </footer>
      <section id="musicPanel" class="music-panel" role="group" aria-label="Music controls" hidden>
        
      <div class="music-heading"><label for="quickMusicVolume">MUSIC</label><button id="quickMusicMute" class="music-mute" aria-label="Mute music" aria-pressed="false">MUTE</button></div>
        <div class="music-track-controls"><button id="quickMusicPrevious" aria-label="Previous music track">‹</button><span id="quickMusicTrackName" class="music-track-name" aria-live="polite">Deep Humming</span><button id="quickMusicNext" aria-label="Next music track">›</button></div>
        <div class="music-level"><input id="quickMusicVolume" type="range" min="0" max="100" step="1" value="40" aria-label="Music volume" aria-valuetext="40 percent"><output id="quickMusicValue" for="quickMusicVolume">40%</output></div>
      </section>
    </section>
    <svg id="chainRibbon" class="chain-ribbon" aria-hidden="true"></svg>
  </main>
<div id="musicTrackToast" class="music-track-toast" role="status" aria-live="polite" hidden></div>
  <section id="endPanel" class="overlay" role="dialog" aria-modal="true" aria-label="Board result" hidden>
    <div class="end-card">
      <button id="endSettings" class="end-settings" aria-label="Settings">⚙</button>
      <svg id="endIcon" class="end-icon" viewBox="0 0 80 80" aria-hidden="true"></svg>
      <div id="endStars" class="end-stars" aria-label="Board stars"></div>
      <div id="endScore" class="end-score" aria-label="Coins earned">0</div>
      <div class="end-chain"><svg viewBox="0 0 32 40" aria-hidden="true"><rect x="8" y="1" width="16" height="24" rx="8"/><rect x="8" y="15" width="16" height="24" rx="8"/></svg><span>Longest chain <strong id="endLongest">0</strong></span><span id="endCleared">0/30</span></div>
      <p id="endFullLight" class="end-full-light" hidden></p>
      <div id="endBestHand" class="end-best">HIGH CARD ×1</div>
      <div id="endClearBonus" class="end-clear-bonus"></div><div id="endPersonalBest" class="end-personal-best"></div><div id="endNewBest" class="end-new-best" hidden>New best</div>
      <button id="endNewDeal" class="bank">NEW DEAL</button>
      <button id="endReplay" class="secondary">REPLAY</button>
      <button id="version" class="version" aria-label="Version 6.18.1; tap three times for diagnostics">v6.18.1</button>
    </div>
  </section>
  <section id="debugPanel" class="overlay" role="dialog" aria-modal="true" aria-label="Diagnostics and local metrics" hidden>
    <div class="debug-card">
      <h2>Diagnostics</h2>
      <p id="graphicsDiagnostics" class="graphics-diagnostics" aria-live="off"></p>
      <dl id="metricFields"></dl>
      <textarea id="metricsJson" readonly aria-label="Metrics JSON"></textarea>
      <div class="debug-actions"><button id="copyMetrics" class="secondary">COPY JSON</button><button id="closeDebug" class="secondary">CLOSE</button></div>
      <p id="copyStatus" role="status"></p>
    </div>
  </section>
  <section id="settingsPanel" class="overlay" role="dialog" aria-modal="true" aria-label="Settings" hidden>
    <div class="settings-card">
      <button id="closeSettings" class="settings-close" aria-label="Close settings">×</button>
      <h2>SETTINGS</h2>
      <div class="setting-label">GRAPHICS</div>
      <div class="animation-options graphics-options" role="group" aria-label="Graphics">
        <button data-graphics-mode="auto" aria-pressed="true">Auto</button>
        <button data-graphics-mode="high" aria-pressed="false">High</button>
        <button data-graphics-mode="pure" aria-pressed="false">Pure</button>
      </div>
      <div class="setting-label">ANIMATIONS</div>
      <div class="animation-options" role="group" aria-label="Animations">
        <button data-animation-mode="off" aria-pressed="false">OFF</button>
        <button data-animation-mode="subtle" aria-pressed="false">SUBTLE</button>
        <button data-animation-mode="full" aria-pressed="true">FULL</button>
      </div>
      <div class="effects-setting"><label for="effectsToggle">SOUND EFFECTS</label><button id="effectsToggle" aria-pressed="true">ON</button></div>
      <div id="cardSoundLabel" class="setting-label">DEAL &amp; DRAW</div>
      <div id="cardSoundOptions" class="animation-options card-sound-options" role="group" aria-labelledby="cardSoundLabel">
        <button id="cardSoundMusical" type="button" data-card-sound="A" aria-pressed="true">Musical</button>
        <button id="cardSoundLinen" type="button" data-card-sound="B" aria-pressed="false">Linen</button>
      </div>
      <div id="eclipseBackSetting" hidden><div class="setting-label">CARD BACK</div><div class="animation-options" role="group" aria-label="Card back"><button type="button" data-card-back="world" aria-pressed="true">World</button><button type="button" data-card-back="eclipse" aria-pressed="false">Eclipse</button></div></div>
      <div class="music-heading"><label for="musicVolume">MUSIC</label><button id="musicMute" class="music-mute" aria-label="Mute music" aria-pressed="false">MUTE</button></div>
      <div class="music-track-controls"><button id="musicPrevious" aria-label="Previous music track">‹</button><span id="musicTrackName" class="music-track-name" aria-live="polite">Deep Humming</span><button id="musicNext" aria-label="Next music track">›</button></div>
      <div class="music-level"><input id="musicVolume" type="range" min="0" max="100" step="1" value="40" aria-label="Music volume" aria-valuetext="40 percent"><output id="musicValue" for="musicVolume">40%</output></div>
      <button id="settingsRecords" class="settings-records">RECORDS</button>
      <button id="settingsLeaderboard" class="settings-records">HIGH SCORES</button>
    </div>
  </section>
  <pre id="diagnostics" class="diagnostics" aria-label="Diagnostics" hidden></pre>
  <div id="graphicsToast" class="music-track-toast graphics-toast" role="status" aria-live="polite" hidden><span>Switched to Pure to keep play smooth</span><button id="keepHigh" type="button">Keep High</button></div>
  
  <script src="./tutorial-eef65b223892d4f0.js" defer></script>
</body>
</html>
